<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4fc">
  <title>Gương Mặt Ngày Hội</title>
  <meta name="description" content="Game đồ họa của CLB Tin học: tự tay kéo, nắn, ghép, tách nền để logo, poster, phim của Ngày hội ra đúng như mong muốn.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts/font.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/khung.css">
  <link rel="stylesheet" href="css/ban-choi.css">
  <link rel="stylesheet" href="css/man-hinh.css">
  <script>
    /* Đặt giao diện trước khi vẽ để không chớp màu. Thanh trạng thái của máy đi theo. */
    try {
      var g = localStorage.getItem('dohoa_giao_dien');
      if (g === 'dark' || g === 'light') document.documentElement.dataset.theme = g;
      if (g === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#090d16');
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Bảng màu tranh dùng chung. Không dùng display:none vì Safari bỏ qua gradient khi đó. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gr-logo" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6d5df6"/><stop offset=".55" stop-color="#a35cf0"/><stop offset="1" stop-color="#ec6fbf"/>
      </linearGradient>
      <linearGradient id="gr-poster" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#312e81"/><stop offset="1" stop-color="#7c2d92"/>
      </linearGradient>
      <linearGradient id="gr-troi" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#ede9fe"/>
      </linearGradient>
      <pattern id="o-ca-ro" width="16" height="16" patternUnits="userSpaceOnUse">
        <rect width="16" height="16" fill="#ffffff"/><rect width="8" height="8" fill="#dcd9ee"/><rect x="8" y="8" width="8" height="8" fill="#dcd9ee"/>
      </pattern>
      <!-- Lưới giấy vẽ của Bản vẽ Ngày hội, theo màu của giao diện sáng hoặc tối. -->
      <pattern id="o-ban-ve" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M20 0H0V20" fill="none" stroke="var(--ke)" stroke-width=".6" opacity=".55"/>
      </pattern>
    </defs>
  </svg>
  <div id="root"></div>
  <script type="module" src="js/app.mjs"></script>
</body>
</html>
